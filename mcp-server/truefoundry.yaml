# TrueFoundry deployment spec for the sample MCP server.
#
# Deploy with the TrueFoundry CLI from this directory:
#   pip install truefoundry
#   tfy login
#   tfy deploy --file truefoundry.yaml --workspace-fqn <your-workspace-fqn>
#
# Or apply it from the TrueFoundry UI by creating a Service and pointing it
# at this repo/folder (it will detect the Dockerfile automatically).

name: sample-mcp-server
type: service

image:
  type: build
  build_source:
    type: local
  build_spec:
    type: dockerfile
    dockerfile_path: ./Dockerfile
    build_context_path: ./

ports:
  - port: 8000
    protocol: TCP
    expose: true
    app_protocol: http

env:
  HOST: "0.0.0.0"
  PORT: "8000"

resources:
  cpu_request: 0.2
  cpu_limit: 0.5
  memory_request: 256
  memory_limit: 512
  ephemeral_storage_request: 500
  ephemeral_storage_limit: 1000

replicas: 1

liveness_probe:
  config:
    type: http
    path: /health
    port: 8000
  initial_delay_seconds: 5
  period_seconds: 10

readiness_probe:
  config:
    type: http
    path: /health
    port: 8000
  initial_delay_seconds: 5
  period_seconds: 10
